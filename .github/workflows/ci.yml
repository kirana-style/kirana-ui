name: ci

# What a pull request must keep true: the workspace checks itself (format, lint with the Kirana
# rules, types, licences, tests), every app builds with 0 compiler errors, and the registry installs
# into a project per framework. The push to `main` keeps the caches warm: only `main` saves them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first one's answer worthless, so
# stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned, not `*-latest`: a label that moves changes the build under us, and
# GitHub annotates every job that uses one. Kirana's engine comes from npm as a prebuilt platform
# package, so no job needs Rust.

jobs:
  check:
    runs-on: ubuntu-26.04
    name: lint, format, types and tests
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Separate steps so a red build names the stage that failed, the quick ones first. The same
      # tasks run in the pre-push hook (`vp run prepush`), and through `vp run`, so a task whose
      # inputs did not change since `main` saved the cache replays its result.

      # Every installed JavaScript dependency's licence against scripts/check-licenses.ts.
      - name: Licences
        run: vp run licenses

      # The registry's style modules, which no app compiles yet: Kirana's diagnostics, warnings
      # included.
      - name: Registry styles
        run: vp run styles

      # The registry's preset codec, configuration and palettes, the builder, Get Code's composer,
      # the docs framework.
      - name: Tests
        run: vp run test

      # Oxfmt, Oxlint with the Kirana rules (@kirana-style/eslint-plugin) and the TypeScript type
      # check (tsgolint), after the site's docs content, which the types read. Every check runs
      # whatever an earlier one found (`--continue-on-error`), so one red run lists them all; a
      # warning fails it, like an error.
      - name: Format, lint and types
        run: vp run check

  build:
    runs-on: ubuntu-26.04
    name: build
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The site and every preview app; a Kirana compiler error fails the build.
      - name: Build
        run: vp run build

      # Every combination's items: flattened, checked against the live styles with Kirana, and
      # validated against shadcn/ui's schema; a difference or an invalid item fails it.
      - name: Registry
        run: vp run registry

      # The project skeletons Get Code offers: every combination composed and packed.
      - name: Templates
        run: vp run templates

      # Each page's JavaScript and stylesheet, and the registry's files, against `budgets.json`.
      - name: Budgets
        run: vp run budgets

      # The apps ship `light-dark()` as written. A CSS minifier aiming below Kirana's browser floor
      # rewrites it into `--lightningcss-light/dark` switches that nothing sets, and the colours
      # vanish in production only: the dev server does not minify.
      - name: Colours survive the build
        run: |
          if grep -rl -- "--lightningcss-" apps/*/dist/client/assets; then
            echo "::error::a built stylesheet lowered light-dark(); set build.cssTarget to Kirana's floor"
            exit 1
          fi

      # The registry and the templates, for the install jobs: what they serve to the installer.
      - name: Hand the registry to the installs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry
          path: apps/site/dist/client/r
          retention-days: 1
          if-no-files-found: error

  # The registry installed with Kirana's own installer, as Get Code has a reader do it: a skeleton
  # per framework started with Get Code's own command (`kirana-style ui init --template` from the
  # templates the build job packed), `add`, built, linted, type-checked, the lockfile validated, for
  # React, Vue and Svelte on both bases, Solid and Angular. `scripts/install-smoke.ts`'s list in four
  # shards side by side (`--shard`), two combinations each; `vp run install` runs it whole.
  install:
    runs-on: ubuntu-26.04
    name: install (${{ matrix.shard }}/4)
    needs: build
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task-cache: "false"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry
          path: apps/site/dist/client/r

      - name: Installs with kirana-style ui
        run: bun scripts/install-smoke.ts --shard ${{ matrix.shard }}/4

  # The one check branch protection requires from this workflow, so adding or renaming a job never
  # changes the ruleset. It always runs, and passes when every job passed or was skipped.
  result:
    name: ci result
    if: always()
    needs: [check, build, install]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job ended in $result"; exit 1 ;;
            esac
          done
