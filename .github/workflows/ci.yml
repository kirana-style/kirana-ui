name: ci

# What a pull request must keep true: the workspace checks itself (format, lint with the Kirana
# rules, types, licences, tests), the preview apps' tests pass in Chromium, Firefox and WebKit
# (for the frameworks the change touches),
# every app builds with 0 compiler errors, and the registry installs into a project per framework. The push to `main` keeps the caches warm: only `main` saves them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first one's answer worthless, so
# stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned, not `*-latest`: a label that moves changes the build under us, and
# GitHub annotates every job that uses one. Kirana's engine comes from npm as a prebuilt platform
# package, so no job needs Rust.

jobs:
  # Which frameworks' browser tests this change needs (`scripts/ci-changes.sh`): those whose bases,
  # helpers or preview app it touches, none for the docs alone, every one for anything shared and on
  # every push to `main`. Plain shell on two fetched commits, so it answers in seconds.
  changes:
    runs-on: ubuntu-26.04
    name: changes
    timeout-minutes: 5
    outputs:
      frameworks: ${{ steps.frameworks.outputs.frameworks }}
      matrix: ${{ steps.frameworks.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Frameworks to test
        id: frameworks
        run: bash scripts/ci-changes.sh

  check:
    runs-on: ubuntu-26.04
    name: format, types and tests
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Separate steps so a red build names the stage that failed, the quick ones first. The same
      # tasks run in the pre-push hook (`vp run prepush`), and through `vp run`, so a task whose
      # inputs did not change since `main` saved the cache replays its result.

      # Every installed JavaScript dependency's licence against scripts/check-licenses.ts.
      - name: Licences
        run: vp run licenses

      # The registry's style modules, which no app compiles yet: Kirana's diagnostics, warnings
      # included.
      - name: Registry styles
        run: vp run styles

      # The registry's preset codec, configuration and palettes, the builder, Get Code's composer,
      # the docs framework.
      - name: Tests
        run: vp run test

      # Oxfmt and the TypeScript type check (tsgolint), after the site's docs content, which the
      # types read; the lint is the `lint` jobs'. Both run whatever the other found
      # (`--continue-on-error`).
      - name: Format and types
        run: vp run content && vp check --no-lint --deny-warnings --continue-on-error

  # Oxlint with the Kirana rules (@kirana-style/eslint-plugin), a warning failing it like an error.
  # The rules read the whole project's diagnostics once per file, on one thread (KF-123), so the
  # lint is most of `vp run check`'s time: `scripts/lint-shard.ts` splits the files Git tracks into
  # six shares, by folder, linted side by side. Locally, `vp run check` still lints them all.
  lint:
    runs-on: ubuntu-26.04
    name: lint (${{ matrix.shard }}/6)
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          scope: -lint-${{ matrix.shard }}

      # The type-aware rules read the site's docs content, as the types do.
      - name: Lint
        run: vp run content && bun scripts/lint-shard.ts --shard ${{ matrix.shard }}/6

  build:
    runs-on: ubuntu-26.04
    name: build
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The site and every preview app; a Kirana compiler error fails the build.
      - name: Build
        run: vp run build

      # Every combination's items: flattened, checked against the live styles with Kirana, and
      # validated against shadcn/ui's schema; a difference or an invalid item fails it.
      - name: Registry
        run: vp run registry

      # The project skeletons Get Code offers: every combination composed and packed.
      - name: Templates
        run: vp run templates

      # Each page's JavaScript and stylesheet, and the registry's files, against `budgets.json`.
      - name: Budgets
        run: vp run budgets

      # The apps ship `light-dark()` as written. A CSS minifier aiming below Kirana's browser floor
      # rewrites it into `--lightningcss-light/dark` switches that nothing sets, and the colours
      # vanish in production only: the dev server does not minify.
      - name: Colours survive the build
        run: |
          if grep -rl -- "--lightningcss-" apps/*/dist/client/assets; then
            echo "::error::a built stylesheet lowered light-dark(); set build.cssTarget to Kirana's floor"
            exit 1
          fi

      # The registry and the templates, for the install jobs: what they serve to the installer.
      - name: Hand the registry to the installs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry
          path: apps/site/dist/client/r
          retention-days: 1
          if-no-files-found: error

  # The preview apps' tests in a real browser (`apps/<app>/test/`, `vp run browser`): every example
  # page mounted and every trigger pressed on each framework and base, no error and no form submitted;
  # the chart's entrance. One job per engine and framework, side by side (`vp run browser:<framework>`),
  # each installing only its engine; the frameworks are the ones this change needs, and the longest
  # jobs (React's and Svelte's in WebKit) are split in two by base (`changes`' matrix).
  browser:
    runs-on: ubuntu-26.04
    name: browser tests (${{ matrix.framework }}${{ matrix.bases && format(' {0}', matrix.bases) || '' }}, ${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.frameworks != '[]'
    timeout-minutes: 20

    strategy:
      # One engine's or framework's failure does not hide what the others would have said.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          scope: -${{ matrix.browser }}-${{ matrix.framework }}${{ matrix.bases && '-half' || '' }}

      # The engine at the version the lockfile's Playwright asks for, with its system libraries.
      - name: Browser
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      # A whole framework through its cached task; a share of its bases straight through Vitest,
      # filtered by the bases' `describe` (`-t`, which `vp run` does not pass on).
      - name: Browser tests
        env:
          BROWSERS: ${{ matrix.browser }}
          FRAMEWORK: ${{ matrix.framework }}
          BASES: ${{ matrix.bases }}
        run: |
          if [ -z "$BASES" ]; then
            vp run "browser:$FRAMEWORK"
          else
            vp test run --project "browser-$FRAMEWORK" -t "^($BASES) > "
          fi

  # The registry installed with Kirana's own installer, as Get Code has a reader do it: a skeleton
  # per framework started with Get Code's own command (`kirana-style ui init --template` from the
  # templates the build job packed), `add`, built, linted, type-checked, the lockfile validated, for
  # React, Vue and Svelte on each of their bases (ui-sdk among them), Solid and Angular.
  # `scripts/install-smoke.ts`'s list in four shards side by side (`--shard`), two or three
  # combinations each; `vp run install` runs it whole.
  install:
    runs-on: ubuntu-26.04
    name: install (${{ matrix.shard }}/4)
    needs: build
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task-cache: "false"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry
          path: apps/site/dist/client/r

      - name: Installs with kirana-style ui
        run: bun scripts/install-smoke.ts --shard ${{ matrix.shard }}/4

  # The one check branch protection requires from this workflow, so adding or renaming a job never
  # changes the ruleset. It always runs, and passes when every job passed or was skipped.
  result:
    name: ci result
    if: always()
    needs: [changes, check, lint, browser, build, install]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job ended in $result"; exit 1 ;;
            esac
          done
