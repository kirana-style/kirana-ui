name: ci

# What a pull request must keep true: the workspace checks itself (format, lint with the Kirana
# rules, types, licences, tests), the preview apps' tests pass in Chromium, Firefox and WebKit
# (for the frameworks the change touches),
# every app builds with 0 compiler errors, and the registry installs into a project per framework. The push to `main` keeps the caches warm: only `main` saves them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first one's answer worthless, so
# stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned, not `*-latest`: a label that moves changes the build under us, and
# GitHub annotates every job that uses one. Kirana's engine comes from npm as a prebuilt platform
# package, so no job needs Rust.

jobs:
  # Which frameworks' browser tests this change needs (`scripts/ci-changes.sh`): those whose bases,
  # helpers or preview app it touches, none for the docs alone, every one for anything shared and on
  # every push to `main`. Plain shell on two fetched commits, so it answers in seconds.
  changes:
    runs-on: ubuntu-26.04
    name: changes
    timeout-minutes: 5
    outputs:
      frameworks: ${{ steps.frameworks.outputs.frameworks }}
      matrix: ${{ steps.frameworks.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Frameworks to test
        id: frameworks
        run: bash scripts/ci-changes.sh

  check:
    runs-on: ubuntu-26.04
    name: format, lint, types and tests
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Separate steps so a red build names the stage that failed, the quick ones first. The same
      # tasks run in the pre-push hook (`vp run prepush`), and through `vp run`, so a task whose
      # inputs did not change since `main` saved the cache replays its result.

      # Every installed JavaScript dependency's licence against scripts/check-licenses.ts.
      - name: Licences
        run: vp run licenses

      # The registry's style modules, which no app compiles yet: Kirana's diagnostics, warnings
      # included.
      - name: Registry styles
        run: vp run styles

      # The registry's preset codec, configuration and palettes, the builder, Get Code's composer,
      # the docs framework.
      - name: Tests
        run: vp run test

      # Oxfmt, Oxlint with the Kirana rules (@kirana-style/eslint-plugin) and the TypeScript type
      # check (tsrs), after the site's docs content, which the types and the type-aware rules read;
      # a warning fails it like an error, and each runs whatever the others found
      # (`--continue-on-error`). Since the rules read the project's diagnostics once per run (KF-123,
      # Kirana 0.4.2) and Vite+ 1.7 type-checks with tsrs, the whole of it takes under a minute,
      # where it once needed six lint jobs side by side.
      - name: Format, lint and types
        run: vp run check

  build:
    runs-on: ubuntu-26.04
    name: build
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The site and every preview app; a Kirana compiler error fails the build.
      - name: Build
        run: vp run build

      # Every combination's items: flattened, checked against the live styles with Kirana, and
      # validated against shadcn/ui's schema; a difference or an invalid item fails it.
      - name: Registry
        run: vp run registry

      # The project skeletons Get Code offers: every combination composed and packed.
      - name: Templates
        run: vp run templates

      # Each page's JavaScript and stylesheet, and the registry's files, against `budgets.json`.
      - name: Budgets
        run: vp run budgets

      # The apps ship `light-dark()` as written. A CSS minifier aiming below Kirana's browser floor
      # rewrites it into `--lightningcss-light/dark` switches that nothing sets, and the colours
      # vanish in production only: the dev server does not minify.
      - name: Colours survive the build
        run: |
          if grep -rl -- "--lightningcss-" apps/*/dist/client/assets; then
            echo "::error::a built stylesheet lowered light-dark(); set build.cssTarget to Kirana's floor"
            exit 1
          fi

      # The registry and the templates, for the install jobs: what they serve to the installer.
      - name: Hand the registry to the installs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry
          path: apps/site/dist/client/r
          retention-days: 1
          if-no-files-found: error

  # The preview apps' tests in a real browser (`apps/<app>/test/`, `vp run browser`): every example
  # page mounted and every trigger pressed on each framework and base, no error and no form submitted;
  # the chart's entrance. One job per engine and framework, side by side (`vp run browser:<framework>`),
  # each installing only its engine; the frameworks are the ones this change needs, and the longest
  # jobs (React's and Svelte's in WebKit) are split in two by base (`changes`' matrix).
  browser:
    runs-on: ubuntu-26.04
    name: browser tests (${{ matrix.framework }}${{ matrix.bases && format(' {0}', matrix.bases) || '' }}, ${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.frameworks != '[]'
    timeout-minutes: 20

    strategy:
      # One engine's or framework's failure does not hide what the others would have said.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          scope: -${{ matrix.browser }}-${{ matrix.framework }}${{ matrix.bases && '-half' || '' }}

      # The engine's build, kept per Playwright version (the lockfile) and engine, so most jobs
      # download nothing; every job still installs the engine's system libraries.
      - name: Browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-

      # The engine's system libraries as apt downloaded them (some 50 to 100 MB of fonts and
      # codecs), kept so a job installs them from here rather than the runner's Ubuntu mirror,
      # which can crawl (59 packages in 15 minutes, where other jobs took 30 seconds). Restored
      # here, saved straight after the install below, so a job whose tests fail still keeps them.
      - name: System libraries cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-

      # The engine at the version the lockfile's Playwright asks for, with its system libraries.
      # apt takes the packages it already has from ~/apt-archives and downloads only the rest; on
      # a stalled connection it gives up after 30 seconds and retries, five times, and it waits
      # for the package lock rather than failing on it. Nothing kills apt from outside: a killed
      # install left apt running, holding the lock for the next attempt.
      - name: Browser
        timeout-minutes: 15
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          printf '%s\n' "Dir::Cache::Archives \"$HOME/apt-archives/\";" \
            'APT::Keep-Downloaded-Packages "true";' 'Binary::apt-get::APT::Keep-Downloaded-Packages "true";' \
            'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-ci >/dev/null
          bunx playwright install --with-deps "$BROWSER"
          # Readable for the cache to save, without apt's own lock file.
          sudo rm -f "$HOME/apt-archives/lock"
          sudo chmod -R a+rX "$HOME/apt-archives"
          # Ubuntu 24.04 and later keep unprivileged user namespaces from processes AppArmor does
          # not name, and Firefox's content sandbox needs them. Lifted for this job's browsers.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Save the system libraries
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}

      # A whole framework through its cached task; a share of its bases straight through Vitest,
      # by their files and their `describe` (which `vp run` does not pass on).
      # Through `scripts/ci-browser.sh`, which runs the tests once more when the engine's page
      # crashed before they could answer, and never when a test failed.
      - name: Browser tests
        env:
          BROWSERS: ${{ matrix.browser }}
          # Firefox without its content sandbox on CI's runner, in case the namespaces stay closed.
          MOZ_DISABLE_CONTENT_SANDBOX: "1"
          FRAMEWORK: ${{ matrix.framework }}
          BASES: ${{ matrix.bases }}
        run: |
          if [ -z "$BASES" ]; then
            bash scripts/ci-browser.sh vp run "browser:$FRAMEWORK"
          else
            # The bases' own files by name (`examples.<base>.`, and `triggers-in-form`, whose
            # bases load lazily), not `-t` alone: `-t` still imports every file, so every base's
            # examples, into the one page (Vue's UI SDK job peaked at 3.3 GB in Firefox; its own
            # file alone, 1.5 GB). `-t` then keeps only these bases' tests.
            files=$(echo "$BASES" | tr '|' '\n' | sed 's/.*/examples.&./')
            bash scripts/ci-browser.sh vp test run --project "browser-$FRAMEWORK" $files triggers-in-form -t "^($BASES) > "
          fi

  # The registry installed with Kirana's own installer, as Get Code has a reader do it: a skeleton
  # per framework started with Get Code's own command (`kirana-style ui init --template` from the
  # templates the build job packed), `add`, built, linted, type-checked, the lockfile validated, for
  # every framework on each of its bases (ui-sdk and Kirana UI among them; not Solid on ui-sdk,
  # which needs a Solid 2 template). `scripts/install-smoke.ts`'s list in four shards side by side
  # (`--shard`), four combinations each; `vp run install` runs it whole.
  install:
    runs-on: ubuntu-26.04
    name: install (${{ matrix.shard }}/4)
    needs: build
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task-cache: "false"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry
          path: apps/site/dist/client/r

      - name: Installs with kirana-style ui
        run: bun scripts/install-smoke.ts --shard ${{ matrix.shard }}/4

  # The one check branch protection requires from this workflow, so adding or renaming a job never
  # changes the ruleset. It always runs, and passes when every job passed or was skipped.
  result:
    name: ci result
    if: always()
    needs: [changes, check, browser, build, install]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job ended in $result"; exit 1 ;;
            esac
          done
