# Updates arrive as pull requests, grouped so a week's updates are one review, not twenty.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # Vite+ fixes the versions of what it bundles: the `vite` alias to its core moves with
      # `vite-plus`, through its own upgrade (`vp migrate`), never one by one.
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      # vue-tsc 3.3 reads some of the Vue blocks' and examples' template bindings as refs (TS2339
      # "Property 'value' does not exist" on a `styles` object, 96 errors); `apps/preview-vue`
      # keeps 3.2 until that is reduced and reported upstream.
      - dependency-name: "vue-tsc"
        versions: [">=3.3.0"]
      # Solid's majors are chosen per base, not per release: Ark UI's base and its preview run
      # Solid 1, the ui-sdk and Kirana UI bases Solid 2 in an app of their own.
      - dependency-name: "solid-js"
        update-types: ["version-update:semver-major"]
    groups:
      # Every Kirana package at one version, the one scripts/use-kirana.ts pins.
      kirana:
        patterns:
          - "@kirana-style/*"
          - "kirana-style"
      # ui-sdk's packages at one version: each adapter peers on its own release of `@ui-sdk/core`,
      # and its betas change their API, so one moved alone breaks the others.
      ui-sdk:
        patterns:
          - "@ui-sdk/*"
      minor-and-patch:
        update-types: [minor, patch]
